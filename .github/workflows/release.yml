name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build a GoReleaser snapshot without creating a tag or release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce owner tag and manual dry-run boundaries
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* && "$ACTOR" != "ecouto" ]]; then
            echo "release: only Erick may promote a v* tag" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DRY_RUN" != true ]]; then
            echo "release: workflow_dispatch is dry-run only; use an owner-created v* tag to publish" >&2
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: true
      - name: Run release self-tests (manual dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/release-test.sh
      - name: GoReleaser snapshot (manual dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: GoReleaser release build (tag; publish is separate)
        if: ${{ github.event_name == 'push' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          output-file: dist/jacu.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Install Cosign
        if: ${{ github.event_name == 'push' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign checksum manifest with GitHub OIDC
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
      - name: Collect publishable assets (files only)
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -maxdepth 1 -type f -exec cp {} release-assets/ \;
          ls -la release-assets
      - name: Upload release assets for publish job
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacu-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'ecouto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: jacu-release-assets
          path: release-assets
      - name: Publish GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f)
          [ "${#assets[@]}" -gt 0 ] || { echo "no assets to publish" >&2; exit 1; }
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$REPOSITORY" --verify-tag --generate-notes
          fi
