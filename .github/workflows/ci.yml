name: CI

# Only pull requests. There is no `push: branches: [main]` because the ruleset
# on main sets `strict_required_status_checks_policy`, which means a branch has
# to be up to date with main before it can merge — so the pull request already
# ran this exact tree. Re-running it after the squash paid for an answer that
# could not differ. It cost ~68 runs a month.
#
# `workflow_dispatch` stays as the emergency exit: when a check has to be
# re-attached to a head that has no new commit to push.
#
# The seven parallel jobs used to be required by name. That billed seven
# minutes of rounding for work that fit in one sequential job, and renaming
# any of them blocked every pull request. The organization reusable verify
# detects scripts/verify.sh, hygiene.sh, e2e.sh and mcp-smoke.sh; this file
# only points. weekly.yml and release.yml stay here — they are not the PR gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-code:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reason=prose-only
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              *.md|docs/*|skills/*|LICENSE|CODE_OF_CONDUCT.md) ;;
              *) reason=code; break ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "${BASE}...${HEAD}")
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}"

  # Prose is cheaper, not unchecked. Nearly every document here is read by a
  # test — living docs, the skill catalogue, provenance, the memory bridge, and
  # `sdd lint --all` over every SDD and its lock. Skipping `verify` on a prose
  # pull request without this job would let a broken SKILL.md or a stale
  # sdd.lock.json reach main green, and break the next code pull request.
  prose:
    needs: [changed-code]
    if: github.event_name == 'pull_request' && needs.changed-code.result == 'success' && needs.changed-code.outputs.reason == 'prose-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: scripts/verify-prose.sh
        run: bash scripts/verify-prose.sh

  # Check context is `verify / verify`. Do not rename: leftover rulesets still
  # looking for that name would block the organization.
  verify:
    needs: [changed-code]
    if: always() && (github.event_name != 'pull_request' || (needs.changed-code.result == 'success' && needs.changed-code.outputs.reason != 'prose-only'))
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  all-checks-passed:
    if: always()
    needs: [changed-code, prose, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Aggregate the verify job
        env:
          RESULT: ${{ needs.verify.result }}
          PROSE: ${{ needs.prose.result }}
          CHANGED: ${{ needs.changed-code.result }}
          REASON: ${{ needs.changed-code.outputs.reason }}
        run: |
          set -euo pipefail
          echo "verify: ${RESULT} prose: ${PROSE} changed-code: ${CHANGED} reason: ${REASON}"
          # Exactly two ways to pass, and every other combination is red. A
          # `skipped` verify is not a pass on its own: the prose lane has to
          # have run and succeeded in its place, which is what stops a pull
          # request from switching the gate off by skipping the one job it has
          # to pass.
          case "${RESULT}" in
            success) exit 0 ;;
            skipped)
              if [ "${CHANGED}" = "success" ] && [ "${REASON}" = "prose-only" ] && [ "${PROSE}" = "success" ]; then
                exit 0
              fi
              echo "::error::verify skipped without a green prose lane (changed-code=${CHANGED} reason=${REASON} prose=${PROSE})"
              exit 1
              ;;
            *) echo "::error::verify result=${RESULT}"; exit 1 ;;
          esac
