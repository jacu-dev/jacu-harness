name: CI

# Only pull requests. There is no `push: branches: [main]` because the ruleset
# on main sets `strict_required_status_checks_policy`, which means a branch has
# to be up to date with main before it can merge — so the pull request already
# ran this exact tree. Re-running it after the squash paid for an answer that
# could not differ. It cost ~68 runs a month.
#
# `workflow_dispatch` stays as the emergency exit: when a check has to be
# re-attached to a head that has no new commit to push.
#
# The seven parallel jobs used to be required by name. That billed seven
# minutes of rounding for work that fit in one sequential job, and renaming
# any of them blocked every pull request. The organization reusable verify
# detects scripts/verify.sh, hygiene.sh, e2e.sh and mcp-smoke.sh; this file
# only points. weekly.yml and release.yml stay here — they are not the PR gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs. A `workflow_dispatch` has no pull request to classify and
  # answers `code`, which is the safe answer: everything runs.
  changed-code:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || [ -z "${HEAD}" ]; then
            echo "reason=code" >> "${GITHUB_OUTPUT}"
            echo "reason=code (not a pull request)"
            exit 0
          fi
          reason=prose-only
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              *.md|docs/*|skills/*|LICENSE|CODE_OF_CONDUCT.md) ;;
              *) reason=code; break ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "${BASE}...${HEAD}")
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}"

  # `verify / verify` is a required check, and the job therefore always runs.
  # Gating the job itself with `if:` was wrong: a skipped required check is not
  # red, it is *absent*, and the merge waits for it forever. The lane goes
  # inside instead — a prose pull request still runs `verify`, just the cheap
  # half of it, and the secrets sweep and provenance-lint run either way.
  verify:
    needs: [changed-code]
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      lane: ${{ needs.changed-code.outputs.reason == 'prose-only' && 'prose' || 'full' }}

  all-checks-passed:
    if: always()
    needs: [changed-code, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Aggregate the verify job
        env:
          RESULT: ${{ needs.verify.result }}
          CHANGED: ${{ needs.changed-code.result }}
          REASON: ${{ needs.changed-code.outputs.reason }}
        run: |
          set -euo pipefail
          echo "verify: ${RESULT} changed-code: ${CHANGED} reason: ${REASON}"
          # Only `success`. `verify` carries no `if:` of its own — it runs on
          # every pull request and picks a cheaper lane for prose — so it is
          # never skipped for a legitimate reason, and treating `skipped` as a
          # pass would turn the one required check into a gate a pull request
          # could switch off by putting `if: false` on the very job it has to
          # pass.
          case "${RESULT}" in
            success) exit 0 ;;
            *) echo "::error::verify result=${RESULT}"; exit 1 ;;
          esac
