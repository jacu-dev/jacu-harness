version: 2

project_name: jacu

builds:
  - id: jacu
    main: ./cmd/jacu
    binary: jacu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: jacu-archives
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  extra_files:
    - glob: ./scripts/install.sh
      name_template: install.sh

# OSS Homebrew formula (not a Cask). skip_upload: the signed GitHub Release
# carries jacu.rb; jacu-dev/homebrew-jacu syncs it. GITHUB_TOKEN cannot push
# to another repository.
brews:
  - name: jacu
    ids:
      - jacu-archives
    homepage: https://github.com/jacu-dev/jacu-harness
    description: Governance harness for coding agents
    license: MIT
    directory: Formula
    skip_upload: true
    url_template: "https://github.com/jacu-dev/jacu-harness/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: jacu-dev
      name: homebrew-jacu
    install: |
      bin.install "jacu"
    test: |
      assert_match version.to_s, shell_output("#{bin}/jacu version")
